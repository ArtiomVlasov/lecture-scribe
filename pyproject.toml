[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "lecture-scribe"
version = "0.2.0"
description = "MCP server: local Whisper transcription of any web-player video plus a notes memory, so an agent can write lecture summaries on its own."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
  "faster-whisper>=1.0",
  "yt-dlp>=2024.0",
  "numpy",
  "mcp>=1.2,<2",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
lecture-scribe = "lecture_scribe.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

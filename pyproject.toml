[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "lecture-scribe"
version = "0.1.0"
description = "Local video transcription service + Claude skill: turn any web-player video into a timestamped transcript an agent can summarize."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
  "fastapi>=0.110",
  "uvicorn>=0.29",
  "faster-whisper>=1.0",
  "yt-dlp>=2024.0",
  "httpx>=0.27",
  "numpy",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
lecture-scribe = "lecture_scribe.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
